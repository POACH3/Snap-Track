<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141615" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SnapTrack</title>
    <script>
      // Sets the theme before first paint, so a saved Light or Dark never flashes the other.
      // Keep in step with src/shared/theme.ts (the storage key and the System rule).
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("snaptrack.theme");
        } catch (e) {}
        var light =
          choice === "light" || (choice !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
